[package]
name = "mercurio-sysml-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mercurio"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
mercurio-core = { path = "../../../mercurio-foundation/crates/mercurio-core", version = "0.1.0" }
mercurio-kerml = { path = "../mercurio-kerml", version = "0.1.0" }
mercurio-sysml = { path = "../mercurio-sysml", version = "0.1.0", features = ["embed-stdlib"] }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zip.workspace = true

