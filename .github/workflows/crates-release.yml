name: Crates release

on:
  push:
    tags:
      - "sysml-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Resume publishing the release version from this ref
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-sysml-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FOUNDATION_REF: foundation-v0.86.0

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mercurio-sysml
      - uses: actions/checkout@v4
        with:
          repository: mercurio-labs/mercurio-foundation
          ref: ${{ env.FOUNDATION_REF }}
          path: mercurio-foundation
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release identity and publishable package set
        working-directory: mercurio-sysml
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace.package\]/{in_package=1; next} in_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          test -n "${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "sysml-v${version}"
          fi
          mapfile -t packages < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.publish == null) | .name' |
              sort
          )
          test "${#packages[@]}" -eq 1
          test "${packages[0]}" = "mercurio-sysml"
      - name: Test workspace
        working-directory: mercurio-sysml
        run: cargo test --workspace --locked
      - name: Check repository boundaries
        working-directory: mercurio-sysml
        env:
          MERCURIO_REPO_ROOT: ../mercurio-foundation
        run: cargo run -p mercurio-tools --bin check_repo_boundaries -- --manifest ../mercurio-foundation/repo-boundaries.json --strict
      - name: Assemble and verify the public crate
        working-directory: mercurio-sysml
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace.package\]/{in_package=1; next} in_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          cargo package -p mercurio-sysml --locked
          rm -rf target/package/verify
          mkdir -p target/package/verify
          tar -xzf "target/package/mercurio-sysml-${version}.crate" -C target/package/verify
          cargo test \
            --manifest-path "target/package/verify/mercurio-sysml-${version}/Cargo.toml" \
            --all-features \
            --locked

  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: qualify
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mercurio-sysml
      - uses: actions/checkout@v4
        with:
          repository: mercurio-labs/mercurio-foundation
          ref: ${{ env.FOUNDATION_REF }}
          path: mercurio-foundation
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish mercurio-sysml
        working-directory: mercurio-sysml
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace.package\]/{in_package=1; next} in_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"

          published() {
            curl --fail --silent --show-error \
              --header "User-Agent: mercurio-sysml-release/${version}" \
              "https://crates.io/api/v1/crates/mercurio-sysml" |
              jq --exit-status --arg version "${version}" \
                '.versions | any(.num == $version)' >/dev/null
          }

          if published; then
            echo "mercurio-sysml ${version} is already published"
            exit 0
          fi

          cargo publish --locked --package mercurio-sysml
