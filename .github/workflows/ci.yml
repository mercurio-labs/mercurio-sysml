name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mercurio-sysml
      - uses: actions/checkout@v4
        with:
          repository: mercurio-labs/mercurio-foundation
          ref: 139cc609fb3419e8673b7dc1596c3921faec2c82
          path: mercurio-foundation
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source-derived native contracts and coverage
        working-directory: mercurio-sysml
        run: |
          python -B tools/translate_pilot_validators.py --check
          python -B tools/generate_validation_rust.py --check
          python -B tools/check_validation_bindings.py --check
          python -B tools/classify_validator_inventory.py --check
          python -B tools/check_bounded_translation.py --check
          python -B tools/check_structural_source_coverage.py --check
          python -B tools/generate_ecore_ownership.py --check
          python -B tools/generate_ecore_hierarchy.py --check
          python -B tools/generate_name_dispatch.py --check
          python -B tools/generate_value_converter_dispatch.py --check
          python -B tools/generate_required_feature_dependencies.py --check
          python -B tools/generate_constructor_constants.py --check
          python -B -m unittest discover -s tools -p test_generate_constructor_constants.py
          python -B -m unittest discover -s tools -p test_generate_required_feature_dependencies.py
          python -B -m unittest discover -s tools -p test_generate_value_converter_dispatch.py
          python -B tools/generate_xtext_terminal_programs.py --check
          python -B tools/export_pilot_lexer_decision.py --validate
          python -B -m unittest discover -s tools -p test_export_pilot_lexer_decision.py
          python -B -m unittest discover -s tools -p test_generate_xtext_terminal_programs.py
          python -B -m unittest discover -s tools -p test_generate_name_dispatch.py
          python -B -m unittest discover -s tools -p test_generate_ecore_hierarchy.py
          python -B -m unittest discover -s tools -p test_generate_ecore_defaults.py
          python -B -m unittest discover -s tools -p test_structural_coverage_plan.py
          python -B -m unittest discover -s tools -p test_generate_ecore_ownership.py
          python -B -m unittest discover -s tools -p test_extract_ecore_semantics.py
          python -B -m unittest discover -s tools -p test_export_pilot_ecore_effective.py
          python -B -m unittest discover -s tools -p test_structural_source_coverage.py
          python -B -m unittest discover -s tools -p test_translate_pilot_validators.py
          python -B -m unittest discover -s tools -p test_generate_validation_rust.py
          python -B -m unittest discover -s tools -p test_check_validation_bindings.py
          python -B -m unittest discover -s tools -p test_validator_inventory.py
          python -B -m unittest discover -s tools -p test_bounded_translation.py
          python -B -m unittest discover -s tools -p test_type_family_translation.py
      - name: Test workspace
        working-directory: mercurio-sysml
        run: cargo test --workspace --locked
      - name: Check repository boundaries
        working-directory: mercurio-sysml
        env:
          MERCURIO_REPO_ROOT: ../mercurio-foundation
        run: cargo run -p mercurio-tools --bin check_repo_boundaries -- --manifest ../mercurio-foundation/repo-boundaries.json --strict
      - name: Build rustdoc without warnings
        working-directory: mercurio-sysml
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Assert the public package set
        working-directory: mercurio-sysml
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.publish == null) | .name' |
              sort
          )
          test "${#packages[@]}" -eq 1
          test "${packages[0]}" = "mercurio-sysml"
      - name: Inspect public crates.io package contents
        working-directory: mercurio-sysml
        run: cargo package --list -p mercurio-sysml --locked
