name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mercurio-sysml
      - uses: actions/checkout@v4
        with:
          repository: mercurio-labs/mercurio-foundation
          ref: develop
          path: mercurio-foundation
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        working-directory: mercurio-sysml
        run: cargo test --workspace --locked
      - name: Check repository boundaries
        working-directory: mercurio-sysml
        run: cargo run -p mercurio-tools --bin check_repo_boundaries -- --manifest ../mercurio-foundation/repo-boundaries.json --strict
      - name: Build rustdoc without warnings
        working-directory: mercurio-sysml
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Inspect public crates.io package contents
        working-directory: mercurio-sysml
        run: >-
          cargo package
          --list
          -p mercurio-sysml-resources
          -p mercurio-language-frontend
          -p mercurio-kerml
          -p mercurio-requirements
          -p mercurio-sysml
          -p mercurio-simulation
          --locked
